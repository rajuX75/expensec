name: Build and Release Production APK

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo "$ENCODED_STRING" | base64 --decode > expense-tracker-release.jks
          else
            echo "KEYSTORE_BASE64 secret is not set! Release build will fall back to debug signing."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/expense-tracker-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Get App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F '"' '{print $2}')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          # Create a dynamic tag based on the version name and short SHA
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "RELEASE_TAG=v${VERSION_NAME}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Expense Tracker ${{ env.RELEASE_TAG }}
          body: "Automated production release APK."
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Firebase Realtime Database
        env:
          RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          RTDB_SECRET: ${{ secrets.FIREBASE_RTDB_SECRET }}
        run: |
          if [ -z "$RTDB_URL" ] || [ -z "$RTDB_SECRET" ]; then
            echo "FIREBASE_RTDB_URL or FIREBASE_RTDB_SECRET is missing. Skipping Firebase DB update."
            exit 0
          fi
          
          BASE_URL=$(echo "$RTDB_URL" | sed 's/\/$//')
          DATE=$(date +'%Y-%m-%d')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | awk '{print $3}')
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F '"' '{print $2}')
          
          # Get the latest commit message
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          
          # Create changelog array with jq
          CHANGELOG_JSON=$(jq -n --arg msg "$COMMIT_MSG" '[{"type": "FEATURE", "text": $msg}]')
          
          PAYLOAD=$(jq -n \
            --arg vc "$VERSION_CODE" \
            --arg vn "$VERSION_NAME" \
            --arg d "$DATE" \
            --argjson cl "$CHANGELOG_JSON" \
            '{
              "versionCode": ($vc | tonumber),
              "versionName": $vn,
              "minSupportedVersionCode": 1,
              "releaseTitle": ("v" + $vn + " — Automated Release"),
              "releaseNotes": "Automated release triggered from GitHub Actions.",
              "changelog": $cl,
              "downloadUrl": "https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk",
              "releaseDate": $d,
              "isMandatory": false
            }')
          
          echo "Updating Firebase RTDB at $BASE_URL/app_version.json..."
          curl -s -X PATCH "$BASE_URL/app_version.json?auth=$RTDB_SECRET" \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD"
          
          echo -e "\nFirebase RTDB update completed."
