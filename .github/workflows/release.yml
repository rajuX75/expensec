name: Build and Release Production APK

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 needed so git push back works with full history
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Fix #1: Auto-increment versionCode & versionName ──────────
      - name: Auto-increment versionCode & versionName
        run: |
          # Bump versionCode
          CURRENT_VC=$(grep "versionCode =" app/build.gradle.kts | awk '{print $3}')
          NEW_VC=$((CURRENT_VC + 1))
          sed -i "s/versionCode = $CURRENT_VC/versionCode = $NEW_VC/" app/build.gradle.kts
          
          # Bump versionName (assuming format X.Y.Z)
          CURRENT_VN=$(grep "versionName =" app/build.gradle.kts | awk -F '"' '{print $2}')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VN"
          NEW_PATCH=$((PATCH + 1))
          NEW_VN="$MAJOR.$MINOR.$NEW_PATCH"
          sed -i "s/versionName = \"$CURRENT_VN\"/versionName = \"$NEW_VN\"/" app/build.gradle.kts
          
          echo "NEW_VERSION_CODE=$NEW_VC" >> $GITHUB_ENV
          echo "NEW_VERSION_NAME=$NEW_VN" >> $GITHUB_ENV
          echo "Bumped version: $CURRENT_VN ($CURRENT_VC) → $NEW_VN ($NEW_VC)"

      - name: Commit & push bumped version
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          # [skip ci] tells GitHub Actions NOT to re-trigger this workflow on the bump commit
          git commit -m "ci: bump version to ${{ env.NEW_VERSION_NAME }} (${{ env.NEW_VERSION_CODE }}) [skip ci]"
          git push

      # ── Fix #3: Run tests before building — broken commits never ship ───────
      - name: Run Unit Tests
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: ./gradlew test

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo "$ENCODED_STRING" | base64 --decode > expense-tracker-release.jks
          else
            echo "KEYSTORE_BASE64 secret is not set! Release build will fall back to debug signing."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/expense-tracker-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: ./gradlew assembleRelease

      # ── Fix #2: Measure the real APK size ──────────────────────────────────
      - name: Measure APK size
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          BYTES=$(stat -c%s "$APK")
          MB=$(echo "scale=2; $BYTES / 1048576" | bc)
          echo "APK_SIZE_MB=$MB" >> $GITHUB_ENV
          echo "APK size: ${MB} MB"

      - name: Get App Version & Changelog
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F '"' '{print $2}')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

          # Tag = v<versionName> — professional tagging format (e.g. v1.1.4)
          echo "RELEASE_TAG=v${{ env.NEW_VERSION_NAME }}" >> $GITHUB_ENV

          # Get the latest commit message for the release notes
          COMMIT_MSG=$(git log -1 --pretty=%B)

          # Safely write multiline string to GITHUB_ENV
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "COMMIT_MSG<<$EOF" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Expense Tracker ${{ env.VERSION_NAME }} (${{ env.RELEASE_TAG }})
          body: ${{ env.COMMIT_MSG }}
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Firebase Realtime Database
        env:
          RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          RTDB_SECRET: ${{ secrets.FIREBASE_RTDB_SECRET }}
        run: |
          if [ -z "$RTDB_URL" ] || [ -z "$RTDB_SECRET" ]; then
            echo "FIREBASE_RTDB_URL or FIREBASE_RTDB_SECRET is missing. Skipping Firebase DB update."
            exit 0
          fi

          BASE_URL=$(echo "$RTDB_URL" | sed 's/\/$//')
          DATE=$(date +'%Y-%m-%d')
          VERSION_CODE="${{ env.NEW_VERSION_CODE }}"
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F '"' '{print $2}')

          # Get the latest commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)

          # Convert multiline commit message into a JSON array of strings
          CHANGES_JSON=$(echo "$COMMIT_MSG" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          PAYLOAD=$(jq -n \
            --arg vc "$VERSION_CODE" \
            --arg vn "$VERSION_NAME" \
            --arg d "$DATE" \
            --arg sz "${{ env.APK_SIZE_MB }}" \
            --argjson cl "$CHANGES_JSON" \
            '{
              "versionCode": ($vc | tonumber),
              "versionName": $vn,
              "minSupportedVersionCode": 1,
              "releaseTitle": ("v" + $vn + " — Automated Release"),
              "releaseNotes": "Automated release triggered from GitHub Actions.",
              "changes": $cl,
              "downloadUrl": "https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk",
              "releaseDate": $d,
              "apkSizeMb": ($sz | tonumber),
              "isMandatory": false
            }')

          echo "Updating Firebase RTDB at $BASE_URL/app_version.json..."
          curl -s -X PATCH "$BASE_URL/app_version.json?auth=$RTDB_SECRET" \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD"

          # Generate a safe key for the changelog node (e.g., 1.1.2 -> v1_1_2)
          SAFE_VN_KEY="v${VERSION_NAME//./_}"

          # Create the historical changelog payload for this specific version
          CHANGELOG_PAYLOAD=$(jq -n \
            --arg vc "$VERSION_CODE" \
            --arg vn "$VERSION_NAME" \
            --arg d "$DATE" \
            --argjson cl "$CHANGES_JSON" \
            '{
              "versionCode": ($vc | tonumber),
              "versionName": $vn,
              "releaseDate": $d,
              "title": ("v" + $vn + " — Automated Release"),
              "changes": $cl
            }')

          # Wrap it in the specific version key
          CHANGELOG_UPDATE=$(jq -n --arg key "$SAFE_VN_KEY" --argjson payload "$CHANGELOG_PAYLOAD" '{($key): $payload}')

          echo -e "\nUpdating Firebase RTDB changelog at $BASE_URL/changelog.json..."
          curl -s -X PATCH "$BASE_URL/changelog.json?auth=$RTDB_SECRET" \
               -H "Content-Type: application/json" \
               -d "$CHANGELOG_UPDATE"

          echo -e "\nFirebase RTDB update completed."
